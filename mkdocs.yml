site_name: AI Handbook — 머신러닝 · 딥러닝 · LLM
site_description: 머신러닝 기초부터 딥러닝, 트랜스포머와 LLM, 에이전트, AI 반도체와 온디바이스 AI까지 — 초급부터 전문가까지 단계적으로 읽는 인공지능 핸드북
site_author: AI Handbook
site_url: https://goodhosup.github.io/ai/
repo_url: https://github.com/goodhosup/ai
repo_name: ai
edit_uri: edit/main/docs/
copyright: 본문과 그림은 직접 작성했습니다. 논문은 제목·저자·연도로 출처를 밝히고, 원문의 그림이나 표를 복제하지 않습니다.

theme:
  name: material
  language: ko
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  icon:
    logo: material/brain
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - content.action.edit

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - path: javascripts/diagrams.mjs
    type: module

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        # Material 기본 Mermaid 통합 대신 javascripts/diagrams.mjs가 렌더링 (큰 시퀀스 다이어그램 가독성)
        - name: mermaid
          class: diagram-src
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang:
        - en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'

validation:
  anchors: warn

watch:
  - includes

nav:
  - 홈: index.md
  - 시작하기:
      - getting-started/index.md
      - AI의 역사와 세 번의 봄: getting-started/history.md
      - AI·머신러닝·딥러닝·생성형 AI: getting-started/landscape.md
      - 논문과 모델 카드 읽는 법: getting-started/reading-papers.md
      - 학습 로드맵: getting-started/roadmap.md
  - 수학 기초:
      - math/index.md
      - 벡터·행렬·텐서: math/linear-algebra.md
      - 미분과 경사하강법: math/calculus.md
      - 확률과 통계: math/probability.md
      - 정보이론 (엔트로피·교차 엔트로피): math/information.md
      - 최적화의 기초: math/optimization.md
  - 머신러닝:
      - ml/index.md
      - 지도·비지도·강화 학습: ml/paradigms.md
      - 선형 회귀와 로지스틱 회귀: ml/linear-models.md
      - 결정 트리와 앙상블: ml/trees.md
      - SVM과 커널: ml/svm.md
      - 군집과 차원 축소: ml/unsupervised.md
      - 과적합과 정규화: ml/overfitting.md
      - 평가 지표와 검증: ml/evaluation.md
      - 강화 학습 기초: ml/reinforcement.md
  - 딥러닝 기초:
      - dl/index.md
      - 퍼셉트론과 MLP: dl/mlp.md
      - 역전파: dl/backprop.md
      - 활성화 함수: dl/activations.md
      - 옵티마이저 (SGD·Adam): dl/optimizers.md
      - 정규화 기법 (BatchNorm·LayerNorm·Dropout): dl/normalization.md
      - 초기화와 학습 안정성: dl/training-stability.md
  - 신경망 구조:
      - arch/index.md
      - CNN: arch/cnn.md
      - RNN과 LSTM: arch/rnn.md
      - 어텐션: arch/attention.md
      - 트랜스포머: arch/transformer.md
      - 임베딩과 표현 학습: arch/embeddings.md
      - 오토인코더와 VAE: arch/vae.md
      - GAN: arch/gan.md
      - 확산 모델: arch/diffusion.md
  - LLM:
      - llm/index.md
      - 토큰화: llm/tokenization.md
      - 사전 학습과 스케일링 법칙: llm/pretraining.md
      - 미세 조정 (SFT·LoRA): llm/finetuning.md
      - 선호 학습 (RLHF·DPO): llm/alignment-training.md
      - 프롬프트 설계: llm/prompting.md
      - 추론 모델과 사고 사슬: llm/reasoning.md
      - MoE (전문가 혼합): llm/moe.md
      - 긴 문맥과 메모리: llm/long-context.md
  - LLM 응용:
      - apps/index.md
      - RAG (검색 증강 생성): apps/rag.md
      - 에이전트와 도구 사용: apps/agents.md
      - 멀티모달 (비전·음성): apps/multimodal.md
      - 코딩 어시스턴트: apps/coding.md
      - 평가와 벤치마크: apps/evaluation.md
  - 시스템과 하드웨어:
      - systems/index.md
      - GPU와 행렬 연산: systems/gpu.md
      - 분산 학습 (데이터·텐서·파이프라인 병렬): systems/distributed.md
      - 추론 최적화 (KV 캐시·배칭·추측 디코딩): systems/inference.md
      - 양자화와 경량화: systems/quantization.md
      - NPU와 온디바이스 AI: systems/npu.md
      - AI 반도체와 메모리 (HBM): systems/ai-chips.md
  - 안전과 사회:
      - society/index.md
      - 정렬과 AI 안전: society/safety.md
      - 편향과 공정성: society/fairness.md
      - 저작권과 개인정보: society/copyright-privacy.md
      - AI 규제 (EU AI Act·AI 기본법): society/regulation.md
  - 실습:
      - practice/index.md
      - 파이썬과 PyTorch 환경: practice/setup.md
      - 손글씨 숫자 분류 (MNIST): practice/mnist.md
      - 작은 트랜스포머 직접 만들기: practice/mini-transformer.md
      - LLM API 쓰기: practice/llm-api.md
      - 로컬 LLM 실행 (라즈베리파이 포함): practice/local-llm.md
  - 최신 동향:
      - next/index.md
      - 2025–2026 모델 지형: next/landscape-2026.md
      - 오픈 웨이트 모델: next/open-weights.md
      - AGI 논쟁과 앞으로의 과제: next/agi.md
  - 레퍼런스:
      - reference/index.md
      - 핵심 논문 연표: reference/papers.md
      - 수식 모음: reference/formulas.md
      - 약어 사전: reference/glossary.md
      - 참고 자료: reference/resources.md
